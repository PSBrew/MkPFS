[project]
name = "mkpfs"
version = "1.0.0"
description = "Create and Manage Unsigned PFS (Playstation File System) image files with file compression and checksum support."
readme = "README.md"
authors = [{ name = "PSBrew", email = "contact@psbrew.com" }]
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["playstation", "pfs", "filesystem", "image", "pfsc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=47.0.0",
    "zlib-ng>=0.5.1",
    "isal>=1.0.0; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64' or platform_machine == 'arm64'",
    "customtkinter>=5.2.0",
    "Pillow>=9.0.0",
]

[project.scripts]
mkpfs = "mkpfs.cli:main"
mkpfs-gui = "mkpfs.gui:main"

[build-system]
requires = ["hatchling<1.33"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/PSBrew/MkPFS"
Issues = "https://github.com/PSBrew/MkPFS/issues"

[tool.hatch.build.targets.wheel]
packages = ["mkpfs"]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "coverage>=7.5.4",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
    "twine>=6.1.0",
    "customtkinter>=5.2.0",
    "Pillow>=9.0.0",
]

[tool.pytest.ini_options]
junit_family = "legacy"
addopts = "--cov --cov-report=term-missing --cov-report=xml --junit-xml=unit.xml"

[tool.coverage.run]
source = ["mkpfs"]
relative_files = true
branch = false
disable_warnings = ["include-ignored"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "def _repr_",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
omit = [
    "_pycache_/*",
    ".git/*",
    "build/*",
    "cache/*",
    "data/*",
    "coverage.xml",
    "dist/*",
    "docs/*",
    "tests/*",
    "train/*",
    "venv/*",
    "related-projects/*",
]

[tool.ruff]
line-length = 119
target-version = "py39"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "legacy",
    "related-projects",
    "tmp",
]

[tool.ruff.lint]
preview = true
select = [
    "ANN", # type annotation
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # use `pathlib.Path` instead of `os.path`
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "any-type", # Checks that function arguments are annotated with a more specific type than Any.
    "unused-loop-control-variable",   # Unused loop variable
    "function-call-in-default-argument",   # Function call in default argument
    "zip-without-explicit-strict",   # `zip()` without `strict=True`
    "missing-trailing-comma", # Missing trailing comma
    "prohibited-trailing-comma", # Trailing comma prohibited
    "D1",     # Missing docstring in public module, class, function, or method
    "incorrect-blank-line-before-class",   # One blank line required before class docstring (ignored because D211 is prioritized in pydocstyle convention 'google')
    "missing-blank-line-after-summary",   # 1 blank line required between summary line and description
    "multi-line-summary-first-line",   # Multi-line docstring summary should start at the first line
    "multi-line-summary-second-line",   # Multi-line docstring summary should start at the second line
    "missing-trailing-period",   # First line of docstring should end with a period
    "logging-f-string",   # Logging statement uses f-string
    "single-line-implicit-string-concatenation", # Implicit string concatenation on a single line
    "multi-line-implicit-string-concatenation", # Implicit string concatenation on multiple lines
    "builtin-open", # `open()` should be replaced by `Path.open()`
    "ambiguous-unicode-character-docstring", # Checks for ambiguous Unicode characters in docstrings.
    "ambiguous-unicode-character-comment", # Checks for ambiguous Unicode characters in comments.
    "if-else-block-instead-of-if-exp", # Use ternary operator instead of `if`-else`-block
]
unfixable = [ ]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]
"mkpfs/logging.py" = ["ambiguous-unicode-character-string"]

[tool.ruff.lint.pydocstyle]
convention = "google"
